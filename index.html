<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blot — Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/lobby.css">
</head>
<body>

<div class="stage">
  <!-- ============ iPhone mockup (landscape) ============ -->
  <div class="device" id="device">
    <div class="device__band"></div>
    <div class="device__btn device__btn--power"></div>
    <div class="device__btn device__btn--voldown"></div>
    <div class="device__btn device__btn--volup"></div>
    <div class="device__btn device__btn--action"></div>

    <div class="device__screen">

      <!-- ============ LOBBY — Figma 736:402 (852 x 393) ============ -->
      <div class="lobby" data-node-id="736:402">

        <!-- background effects -->
        <div class="bg-fx" data-node-id="736:408">
          <img class="bg-fx__base" alt="" data-node-id="736:409">
          <img class="bg-fx__glow" alt="" data-node-id="736:412">
          <div class="bg-fx__hue" data-node-id="736:413"></div>
        </div>

        <!-- vignette -->
        <img class="vignette" alt="" data-node-id="736:414">

        <!-- ============ play modes ============ -->
        <div class="modes" data-node-id="736:427">

          <!-- Training -->
          <button class="card card--side" data-mode="training" data-node-id="736:428">
            <img class="card__bg card__bg--training" alt="" data-node-id="736:429">
            <img class="card__char--training" alt="" data-node-id="736:430">
            <img class="ellipses ellipses--training" alt="" data-node-id="736:432">
            <div class="card__text card__text--side" data-node-id="736:435">
              <div class="card__copy card__copy--side">
                <p class="card__title card__title--side" data-node-id="736:437">Training Game</p>
                <p class="card__sub card__sub--side" data-node-id="736:438">Play with bots to master Blot</p>
              </div>
            </div>
          </button>

          <!-- Play Online (active) -->
          <button class="card card--online" data-mode="online" data-node-id="736:439">
            <img class="online__under" alt="" data-node-id="736:440">
            <img class="online__hero"  alt="" data-node-id="736:472">
            <img class="online__over"  alt="" data-node-id="736:473">
            <div class="card__text" data-node-id="736:489">
              <div class="card__copy">
                <p class="card__title card__title--grad" data-node-id="736:491">Play Online</p>
                <p class="card__sub" data-node-id="736:492">Play against random opponents</p>
              </div>
              <span class="btn" role="img" aria-label="Play Now" data-node-id="736:493">
                <img class="btn__art" alt="" data-node-id="736:495">
              </span>
              <img class="hairline hairline--online" alt="" data-node-id="736:496">
            </div>
          </button>

          <!-- Play with Friends -->
          <button class="card card--side" data-mode="friends" data-node-id="736:497">
            <img class="card__bg card__bg--friends" alt="" data-node-id="736:498">
            <img class="card__char--friends" alt="" data-node-id="736:499">
            <img class="ellipses ellipses--friends" alt="" data-node-id="736:501">
            <div class="card__text card__text--side card__text--friends" data-node-id="736:504">
              <div class="card__copy card__copy--side">
                <p class="card__title card__title--side" data-node-id="736:506">Play with Friends</p>
                <p class="card__sub card__sub--side card__sub--grey" data-node-id="736:507">Battle your friends in Blot now</p>
              </div>
              <img class="hairline hairline--friends" alt="" data-node-id="736:508">
            </div>
          </button>

        </div>

        <!-- ============ header ============ -->
        <div class="header" data-node-id="736:509">

          <div class="profile" data-node-id="736:510">
            <img class="profile__pic" alt="" data-node-id="736:511">
            <div class="profile__info" data-node-id="736:516">
              <div class="profile__row" data-node-id="736:517">
                <p class="profile__name" data-node-id="736:518">Artexcb</p>
                <div class="rank" data-node-id="736:519"><img class="rank__img" alt=""></div>
              </div>
              <div class="xp" data-node-id="738:780">
                <img class="xp__fill" alt="" data-node-id="738:781">
              </div>
            </div>
          </div>

          <div class="tabs" data-node-id="736:523">
            <div class="tab" style="width:110px" data-node-id="737:751">
              <img class="tab__chrome" alt="" data-chrome="110">
              <span class="tab__pennant"></span>
              <p class="tab__label" data-node-id="737:758">No ads</p>
              <img class="badge badge--crown" alt="" data-node-id="738:832">
            </div>
            <div class="tab" style="width:80px" data-node-id="737:770">
              <img class="tab__chrome" alt="" data-chrome="80">
              <span class="tab__pennant"></span>
              <p class="tab__label" data-node-id="737:775">156</p>
              <img class="badge badge--gem" alt="" data-node-id="738:777">
            </div>
            <div class="tab" style="width:98px" data-node-id="737:762">
              <img class="tab__chrome" alt="" data-chrome="98">
              <span class="tab__pennant"></span>
              <p class="tab__label" data-node-id="737:766">3,458</p>
              <img class="badge badge--coin" alt="" data-node-id="737:767">
            </div>
          </div>

        </div>

        <!-- ============ bottom icons ============ -->
        <div class="dock" data-node-id="737:596">
          <div class="dock__left" data-node-id="737:571">
            <button class="dock__btn" aria-label="Friends"     data-node-id="737:562"><img class="dock__chrome" alt=""><img class="dock__glyph" alt="" data-glyph="users"></button>
            <button class="dock__btn" aria-label="Quests"      data-node-id="737:567"><img class="dock__chrome" alt=""><img class="dock__glyph" alt="" data-glyph="clipboard"></button>
            <button class="dock__btn" aria-label="Leaderboard" data-node-id="737:572"><img class="dock__chrome" alt=""><img class="dock__glyph" alt="" data-glyph="ranking"></button>
            <button class="dock__btn" aria-label="Battles"     data-node-id="737:576"><img class="dock__chrome" alt=""><img class="dock__glyph" alt="" data-glyph="sword"></button>
          </div>
          <button class="dock__btn" aria-label="Settings" data-node-id="737:631">
            <img class="dock__chrome" alt=""><img class="dock__glyph" alt="" data-glyph="gear">
          </button>
        </div>

      </div>
      <!-- ============ /LOBBY ============ -->

      <div class="device__island"></div>
      <div class="device__home"></div>
    </div>
  </div>
</div>

<script src="assets/lobby.js"></script>
</body>
</html>
